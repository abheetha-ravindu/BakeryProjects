<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review and process customer refund requests.">
  <title>Cake Studio | Refund requests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin-panel.css">
  <style>
    .status-badge {
      display: inline-flex;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f3eee9;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .status-badge[data-status="PENDING"] {
      background: #fff4d8;
      color: #805a00;
    }

    .status-badge[data-status="APPROVED"] {
      background: #e5f6e8;
      color: #216333;
    }

    .status-badge[data-status="REJECTED"] {
      background: #ffebeb;
      color: #9c2c32;
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .action-button {
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #fff;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .action-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .approve-button { background: #198754; }
    .approve-button:hover { background: #146c43; }
    .reject-button { background: #bd3545; }
    .reject-button:hover { background: #a52c3b; }

    .reason-cell {
      min-width: 220px;
      max-width: 420px;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .empty-state {
      padding: 2rem;
      color: #715f55;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/adminDashboard">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Cake Studio</span>
      </a>
      <nav class="nav-section" aria-label="Admin pages">
        <div class="nav-title">Admin</div>
        <a class="nav-item" href="/adminDashboard"><span class="icon">⌂</span>Dashboard</a>
        <a class="nav-item" href="/customOrders"><span class="icon">◇</span>Custom Orders</a>
        <a class="nav-item" href="/bakeryOrders"><span class="icon">▣</span>Bakery Orders</a>
        <a class="nav-item" href="/adminPayments"><span class="icon">▣</span>Payments</a>
        <a class="nav-item active" href="/adminRefunds" aria-current="page"><span class="icon">↩</span>Refunds</a>
        <a class="nav-item" href="/adminItems"><span class="icon">▤</span>Items</a>
        <a class="nav-item" href="/userManagement"><span class="icon">♙</span>User Management</a>
      </nav>
    </div>
  </header>

  <div class="banner" id="demoBanner" role="alert" hidden></div>

  <main class="wrap">
    <section class="intro compact">
      <h1>Refund requests</h1>
      <p>Review customer requests and approve or reject pending refunds.</p>
    </section>

    <div class="toolbar">
      <label class="field-label" for="statusFilter">Show</label>
      <select class="select" id="statusFilter">
        <option value="">All requests</option>
        <option value="PENDING">Pending</option>
        <option value="APPROVED">Approved</option>
        <option value="REJECTED">Rejected</option>
      </select>
      <button class="btn" id="refreshButton" type="button">Refresh</button>
    </div>

    <div class="table-wrap">
      <table class="orders-table">
        <thead>
          <tr>
            <th>Request</th>
            <th>Order</th>
            <th>Date</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="refundTableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" hidden>No refund requests found.</div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap">Cake Studio administration.</div>
  </footer>

  <div class="toast" id="toast" role="status"></div>
  <script src="/js/common.js"></script>
  <script src="/js/admin-refunds.js"></script>
</body>
</html>
