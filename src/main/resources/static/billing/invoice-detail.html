<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Details</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 30px; }
        .page-nav { max-width: 600px; margin: 0 auto 20px; display: flex; justify-content: flex-end; gap: 18px; }
        .page-nav a { color: #8f2736; font-size: 14px; font-weight: 600; text-decoration: none; }
        .page-nav a:hover { text-decoration: underline; }
        .invoice-box { max-width: 600px; margin: auto; padding: 30px; background: white; border: 1px solid #eee; border-radius: 5px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .title { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 16px; }
        .label { font-weight: bold; color: #555; }
        .btn-container { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-print { background-color: #2ecc71; color: white; }
        .btn-back { background-color: #95a5a6; color: white; }

        @media print {
            .btn-container { display: none; }
            body { background: white; padding: 0; }
            .invoice-box { border: none; box-shadow: none; }
        }
    </style>
</head>
<body>

<nav class="page-nav" aria-label="Account navigation">
    <a href="/profile">My Profile</a>
    <a href="/billing/my-invoices.html">My Invoices</a>
</nav>

<div class="invoice-box">
    <div class="title">📄 INVOICE RECEIPT</div>

    <div class="info-row"><span class="label">Invoice ID:</span> <span id="detId">-</span></div>
    <div class="info-row"><span class="label">Invoice Number:</span> <span id="detNo">-</span></div>
    <div class="info-row"><span class="label">Issued Date:</span> <span id="detDate">-</span></div>
    <div class="info-row" style="border-top: 1px dashed #eee; padding-top: 10px; margin-top: 15px;">
        <span class="label" style="font-size: 18px; color: #2c3e50;">Total Amount Paid:</span>
        <span id="detTotal" style="font-size: 18px; font-weight: bold; color: #2ecc71;">$0.00</span>
    </div>

    <div class="btn-container">
        <a href="my-invoices.html" class="btn btn-back">⬅ Back to List</a>
        <button class="btn btn-print" onclick="window.print()">🖨 Print Invoice</button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const invoiceId = urlParams.get('id');

        if (invoiceId) {

            fetch('/api/invoices/' + invoiceId)
                .then(response => response.json())
                .then(invoice => {

                    document.getElementById('detId').innerText = invoice.id;
                    document.getElementById('detNo').innerText = invoice.invoiceNumber;
                    document.getElementById('detDate').innerText = invoice.invoiceDate;


                    document.getElementById('detTotal').innerText = "$" + invoice.amount.toFixed(2);
                })
                .catch(error => console.error('Error fetching invoice details:', error));
        }
    });
</script>

</body>
</html>
