<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - User List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background-color: #2C1E16; color: white; }
        .del-btn { background-color: #d9534f; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<div class="login-container" style="max-width: 700px;">
    <h2>users list (Registered Users)</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.username}">John</td>
            <td th:text="${user.email}">john@gmail.com</td>
            <td th:text="${user.phoneNumber}">0771234567</td>
            <td>
                <a th:href="@{/admin/user/delete/{id}(id=${user.id})}" class="del-btn">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/main}" style="display: block; margin-top: 20px; color: #555; text-decoration: none;">← Back to Main Dashboard</a>
</div>

</body>
</html>
