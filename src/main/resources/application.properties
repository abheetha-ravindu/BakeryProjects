spring.application.name=bakery-shop


# H2 File-based Database Configuration
spring.datasource.url=jdbc:h2:file:./data/bakerydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Spring Data JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console Settings (To view database via browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configure all three properties to provision the initial administrator account.
# Passwords are stored as salted PBKDF2 hashes.
app.admin.username=
app.admin.email=
app.admin.password=